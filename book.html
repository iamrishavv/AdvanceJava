<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Book Form</title>
</head>

<body>
<h2>Book Entry Form</h2>
<form action="book" method="post">
    Book ID: <input type="number" name="bookId" required><br><br>
    Book Name: <input type="text" name="bookName" required><br><br>
    Book Price: <input type="number" step="0.01" name="bookPrice" required><br><br>
    <input type="submit" value="Save Book">
</form>

</body>
</html>
